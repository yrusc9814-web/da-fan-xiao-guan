name: Windows Release Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run release:windows
      - run: npm run release:windows:verify -- release/搭饭小馆
      - run: node scripts/smoke-windows-release.mjs release/搭饭小馆
      - shell: pwsh
        run: Compress-Archive -Path 'release\搭饭小馆' -DestinationPath 'release\搭饭小馆-windows-x64.zip' -Force
      - shell: pwsh
        run: Expand-Archive -LiteralPath 'release\搭饭小馆-windows-x64.zip' -DestinationPath 'release\zip-smoke' -Force
      - run: node scripts/verify-windows-release.mjs release/zip-smoke/搭饭小馆
      - run: node scripts/smoke-windows-release.mjs release/zip-smoke/搭饭小馆
      - uses: actions/upload-artifact@v4
        with:
          name: 搭饭小馆-windows-x64
          path: release/搭饭小馆-windows-x64.zip
          if-no-files-found: error
